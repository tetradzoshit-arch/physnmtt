<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>НМТ Фізика — тренажер</title>
<style>
:root{--bg:#f4f6f3;--c:#fff;--t:#14213d;--m:#5d6b82;--a:#0f766e;--g:#15803d;--r:#c2410c;--b:#d5dbe3;--gr:#e6ece8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1a;--c:#152424;--t:#e6f0ee;--m:#92a8a4;--a:#2dd4bf;--g:#4ade80;--r:#fb923c;--b:#2a3f3d;--gr:#162626}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Georgia,serif;color:var(--t);background:var(--bg);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:24px 24px}
#app{display:flex;min-height:100vh}#sb{width:230px;flex:none;position:sticky;top:0;height:100vh;padding:18px 14px;background:var(--c);border-right:1px solid var(--b);display:flex;flex-direction:column;gap:10px}main{flex:1;max-width:1040px;margin:0 auto;padding:18px 22px;min-width:0}#top{display:flex;justify-content:flex-end;margin-bottom:14px}
h1{font-size:1.5rem;margin:6px 0 12px}h2{font-size:1.15rem;margin:0 0 10px}
nav{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}nav button{text-align:left;padding:11px 14px}
button,select,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:6px;padding:8px 14px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button.p,nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
.card{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--a);border-radius:6px;padding:16px;margin-bottom:14px}
.q{font-size:1.35rem;line-height:1.6;margin:14px 0}.mut{color:var(--m);font-size:.9rem}
.fig{display:block;margin:10px 0;color:var(--t);width:100%;max-width:560px;height:auto}
.o{display:block;width:100%;text-align:left;margin:9px 0;padding:15px 18px;font-size:1.12rem}.o.sel{border-color:var(--a);box-shadow:inset 0 0 0 2px var(--a)}
.o.ok{background:var(--g);color:#fff}.o.bad{background:var(--r);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr 48px;gap:10px;align-items:center;margin:6px 0}
.bar{height:12px;background:var(--gr);border:1px solid var(--b)}.bar i{display:block;height:100%}
.fb{margin:10px 0;padding:10px;border:1px dashed var(--b)}
.act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
label{display:block;margin:8px 0}
html[data-th=dark]{--bg:#0e1a1a;--c:#152424;--t:#e6f0ee;--m:#92a8a4;--a:#2dd4bf;--g:#4ade80;--r:#fb923c;--b:#2a3f3d;--gr:#162626}
html[data-th=light]{--bg:#f4f6f3;--c:#fff;--t:#14213d;--m:#5d6b82;--a:#0f766e;--g:#15803d;--r:#c2410c;--b:#d5dbe3;--gr:#e6ece8}
.ach{display:inline-block;margin:4px;padding:6px 10px;border:1px solid var(--b);border-radius:6px;opacity:.45}.ach.on{opacity:1;border-color:var(--a);background:var(--gr)}
select.s{padding:3px 8px}
.card{border-radius:12px;box-shadow:0 2px 10px #0000000d;padding:22px}
.qw{display:flex;gap:16px;align-items:flex-start}.qw>.card{flex:1;min-width:0}.qw>aside.card{flex:none;width:230px}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.gn{padding:10px 0;text-align:center}.gn.cur{outline:2px solid var(--a)}.gn.sv{background:var(--a);color:#fff}
.bn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-left-color:var(--r)}.bn b{margin-right:10px;font-size:1.2rem}
#in{font-size:1.25rem;padding:12px;width:240px}.act button{padding:12px 20px}
#md{position:fixed;inset:0;background:#000c;z-index:9;overflow:auto;padding:12px}.mc{max-width:1000px;margin:auto;background:var(--c);padding:12px;border-radius:10px}.mc img{width:100%;display:block;margin-top:10px}
@media(max-width:800px){#app{flex-direction:column}#sb{width:auto;height:auto;position:static}nav{flex-direction:row;flex-wrap:wrap}.qw{flex-direction:column}.qw>aside.card{width:100%}}

/* AI Helper floating panel */
#ai-btn{position:fixed;right:16px;bottom:20px;z-index:20;width:56px;height:56px;border-radius:50%;background:var(--a);color:#fff;border:none;font-size:1.5rem;box-shadow:0 4px 16px #0003;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#ai-btn:hover{transform:scale(1.08)}
#ai-panel{position:fixed;right:16px;bottom:86px;z-index:21;width:min(380px,calc(100vw - 32px));max-height:min(560px,70vh);background:var(--c);border:1px solid var(--b);border-radius:14px;box-shadow:0 8px 32px #0004;display:none;flex-direction:column;overflow:hidden;font-family:system-ui,sans-serif}
#ai-panel.open{display:flex}
#ai-head{padding:12px 14px;background:var(--a);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:600}
#ai-head button{background:transparent;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:2px 8px}
#ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ai-msg{max-width:92%;padding:10px 12px;border-radius:12px;font-size:.92rem;line-height:1.45;white-space:pre-wrap}
.ai-msg.bot{background:var(--c);border:1px solid var(--b);align-self:flex-start;border-bottom-left-radius:4px}
.ai-msg.user{background:var(--a);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
#ai-quick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--b);background:var(--c)}
#ai-quick button{font-size:.78rem;padding:6px 10px;border-radius:20px;border:1px solid var(--b);background:var(--gr);cursor:pointer;color:var(--t)}
#ai-quick button:hover{border-color:var(--a);background:var(--a);color:#fff}
#ai-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--b);background:var(--c)}
#ai-input{flex:1;padding:10px 12px;border:1px solid var(--b);border-radius:8px;font:inherit;background:var(--bg);color:var(--t)}
#ai-send{padding:10px 14px;background:var(--a);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.ai-typing{opacity:.6;font-style:italic}
@media(max-width:800px){#ai-panel{right:8px;left:8px;width:auto;bottom:80px}}

</style></head><body><div id=app><aside id=sb><h1>⚛ НМТ Фізика</h1><nav><button data-v="home" onclick="go('home')">🧭 Діагностика</button><button data-v="train" onclick="go('train')">✏️ Тренування</button><button data-v="exam" onclick="go('exam')">⏱ Екзамен</button><button data-v="prog" onclick="go('prog')">📈 Прогрес</button></nav><button onclick="th()">◐ Світла / темна</button></aside><main><div id=top><button class=p onclick="ref()">📘 Довідкові матеріали</button></div><div id="v"></div></main></div>
<script>
const TP=['Механіка','Молекулярна фізика','Електродинаміка','Коливання, хвилі, оптика','Квантова фізика'];
const R=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pk=(r,a)=>a[Math.floor(r()*a.length)];
const fm=n=>String(+(+n).toFixed(2)).replace('.',',');
function plot(p,xl,yl,cl){const W=290,H=180,L=42,B=30,mx=Math.max(...p.map(a=>a[0])),my=Math.max(...p.map(a=>a[1])),X=x=>L+x/mx*(W-L-15),Y=y=>H-B-y/my*(H-B-18);
let s=`<svg viewBox="0 0 ${W} ${H}" width="320" class="fig"><g stroke="currentColor" fill="none"><path d="M${L} 8V${H-B}H${W-4}"/><path stroke="#0f766e" stroke-width="2.5" d="${p.map((a,i)=>(i?'L':'M')+X(a[0])+' '+Y(a[1])).join('')}${cl?'Z':''}"/>`;
p.forEach(a=>s+=`<path stroke-dasharray="3" opacity=".45" d="M${L} ${Y(a[1])}H${X(a[0])}V${H-B}"/>`);
s+=`</g><g fill="currentColor" font-size="11" text-anchor="middle">`;
[...new Set(p.map(a=>a[0]))].forEach(x=>s+=`<text x="${X(x)}" y="${H-B+14}">${x}</text>`);
[...new Set(p.map(a=>a[1]))].forEach(y=>s+=`<text x="${L-14}" y="${Y(y)+4}">${y}</text>`);
return s+`<text x="${W-14}" y="${H-6}">${xl}</text><text x="${L+16}" y="12">${yl}</text></g></svg>`}
const circ=(a,b,c)=>`<svg viewBox="0 0 300 130" width="320" class="fig"><g stroke="currentColor" fill="none" stroke-width="1.5"><path d="M5 65H40M40 30V100M40 30H70M40 100H70M130 30H160M130 100H160M160 30V100M160 65H190M250 65H295"/><rect x="70" y="20" width="60" height="20"/><rect x="70" y="90" width="60" height="20"/><rect x="190" y="55" width="60" height="20"/></g><g fill="currentColor" font-size="12" text-anchor="middle"><text x="100" y="15">R₁=${a} Ом</text><text x="100" y="125">R₂=${b} Ом</text><text x="220" y="48">R₃=${c} Ом</text></g></svg>`;
const lens=(F,d)=>{const s=110/(3*F),x=v=>150+v*s;return `<svg viewBox="0 0 300 130" width="320" class="fig"><g stroke="currentColor" fill="none" stroke-width="1.5"><path d="M5 65H295M150 10V120M${x(-d)} 65V30M${x(-d)-5} 38L${x(-d)} 30L${x(-d)+5} 38"/><path d="M${x(-F)} 60V70M${x(F)} 60V70M${x(-2*F)} 60V70M${x(2*F)} 60V70"/></g><g fill="currentColor" font-size="12" text-anchor="middle"><text x="${x(-F)}" y="85">F</text><text x="${x(F)}" y="85">F</text><text x="${x(-2*F)}" y="85">2F</text><text x="${x(2*F)}" y="85">2F</text></g></svg>`};
const G=[
{t:0,n:'Графік v(t)',f:(r,d)=>{const a=pk(r,[0,10,20]),b=pk(r,d>1?[30,40,50]:[30,40]),t1=pk(r,[2,4]),t2=t1+pk(r,[2,4]),ans=(a+b)/2*t1+b*(t2-t1);return{ex:`Шлях — площа під графіком: розгін (${a}+${b})/2·${t1} = ${(a+b)/2*t1} м, далі рівномірно ${b}·${t2-t1} = ${b*(t2-t1)} м. Разом ${ans} м.`,q:`За графіком швидкості v(t) знайдіть шлях тіла за ${t2} с.`,fig:plot([[0,a],[t1,b],[t2,b]],'t, с','v, м/с'),ans,u:'м',wr:[[b*t2,'Швидкість на розгоні менша за максимальну: шлях — це площа під графіком, а не v·t.'],[(a+b)*t1+b*(t2-t1),'Площа трапеції — півсума основ, а не сума.'],[(a+b)/2*t1,'Враховано лише ділянку розгону.']]}}},
{t:0,n:'Похила площина',f:r=>{const m=pk(r,[2,4,6,8,10,12,20]),ans=5*m;return{ex:`F = mg·sin30° = ${m}·10·½ = ${ans} Н.`,q:`Тіло масою ${m} кг лежить на гладенькій похилій площині з кутом нахилу 30°. Яку силу вздовж площини треба прикласти, щоб утримати тіло? g = 10 м/с².`,ans,u:'Н',wr:[[10*m,'Забули sin α: уздовж площини діє mg·sin α, а не mg.'],[8.66*m,'Це mg·cos α — складова, що притискає тіло до площини.'],[2.5*m,'sin 30° = 1/2, а не 1/4.']]}}},
{t:0,n:'Вільне падіння',f:r=>{const t=pk(r,[2,3,4,5,6]),h=5*t*t;return{ex:`h = gt²/2, звідси t² = 2h/g = ${2*h}/10 = ${t*t}, t = ${t} с.`,q:`Тіло вільно падає з висоти ${h} м без початкової швидкості. Знайдіть час падіння. g = 10 м/с².`,ans:t,u:'с',wr:[[h/5,'Ви знайшли t², а потрібен t — добудьте корінь.'],[Math.sqrt(h/10),'У формулі h = gt²/2 двійка стоїть у знаменнику.'],[h/10,'h = gt²/2, звідси t² = 2h/g; потім потрібен корінь.']]}}},
{t:0,n:'Кінетична енергія',f:(r,d)=>{const m=pk(r,[2,4,6,8,10]),v=pk(r,d>1?[4,6,8,10]:[2,4,6]),ans=m*v*v/2;return{ex:`Ek = mv²/2 = ${m}·${v}²/2 = ${ans} Дж.`,q:`Яку кінетичну енергію має тіло масою ${m} кг, що рухається зі швидкістю ${v} м/с?`,ans,u:'Дж',wr:[[m*v*v,'Ek = mv²/2: пропущено ділення на 2.'],[m*v/2,'Швидкість у формулі кінетичної енергії стоїть у квадраті.'],[m*v,'Перевірте формулу Ek = mv²/2.']]}}},
{t:1,n:'Ізохорний процес',f:r=>{const p=pk(r,[40,60,100,120]),k=pk(r,[2,3,.5]),t2=300*k-273;return{ex:`T₁ = 27+273 = 300 К, T₂ = ${t2}+273 = ${300*k} К. При V = const p₂ = p₁·T₂/T₁ = ${p}·${300*k}/300 = ${p*k} кПа.`,q:`Газ у закритій посудині (V = const) має тиск ${p} кПа за температури 27 °C. Який тиск стане за температури ${t2} °C?`,ans:p*k,u:'кПа',wr:[[p*t2/27,'Температуру в газових законах треба переводити в кельвіни: T = t + 273.'],[p/k,'p/T = const: зі зростанням T тиск зростає, а не спадає.'],[p*(k+1),'p₂ = p₁·T₂/T₁, без додавання.']]}}},
{t:1,n:'Робота за цикл p–V',f:r=>{const p=pk(r,[100,200]),dp=pk(r,[100,200,300]),V=pk(r,[2,4]),dV=pk(r,[2,4,6]);return{ex:`Робота за цикл — площа прямокутника: Δp·ΔV = ${dp} кПа · ${dV} л = ${dp*dV} Дж.`,q:`На рисунку зображено цикл газу в координатах p–V. Яку роботу виконав газ за цикл?`,fig:plot([[V,p],[V+dV,p],[V+dV,p+dp],[V,p+dp]],'V, л','p, кПа',1),ans:dp*dV,u:'Дж',wr:[[(p+dp)*(V+dV),'Робота за цикл — площа фігури всередині циклу, а не добуток крайніх значень.'],[dp*dV/2,'Цикл — прямокутник: множника 1/2 немає.'],[p*dV,'Це робота лише на одній ділянці, а не за весь цикл.']]}}},
{t:2,n:'Змішане з’єднання',f:r=>{const[a,b,rp]=pk(r,[[6,3,2],[12,4,3],[6,6,3],[4,4,2],[12,6,4]]),c=pk(r,[2,4,6,8]),k=pk(r,[1,2,3]),U=k*(rp+c);return{ex:`R₁₂ = ${a}·${b}/(${a}+${b}) = ${rp} Ом. Загальний опір ${rp+c} Ом, I = ${U}/${rp+c} = ${k} А, U₃ = I·R₃ = ${k}·${c} = ${k*c} В.`,q:`До кола, зображеного на рисунку, прикладено напругу U = ${U} В. Знайдіть напругу на резисторі R₃.`,fig:circ(a,b,c),ans:k*c,u:'В',wr:[[U*c/(a+b+c),'R₁ і R₂ з’єднані паралельно: 1/R = 1/R₁ + 1/R₂, а не сума опорів.'],[U/2,'Напруга ділиться пропорційно опорам, а не навпіл.'],[k*rp,'Це напруга на паралельній ділянці, а потрібна — на R₃.']]}}},
{t:2,n:'Потужність струму',f:(r,d)=>{const U=pk(r,d>1?[24]:[12,24]),R=pk(r,[6,8,12,16]);return{ex:`P = U²/R = ${U}²/${R} = ${U*U/R} Вт.`,q:`Резистор опором ${R} Ом підключено до напруги ${U} В. Яка потужність струму в резисторі?`,ans:U*U/R,u:'Вт',wr:[[U/R,'Це сила струму; потужність P = UI = U²/R.'],[U*R,'P = U²/R: опір стоїть у знаменнику.'],[U*U/(2*R),'Множник 1/2 тут зайвий.']]}}},
{t:2,n:'Електризація дотиком',f:r=>{const q1=pk(r,[10,20,30,40]);let q2;do q2=pk(r,[-50,-40,-30,-20,-10,10,20,30]);while((q1+q2)%20);const a=(q1+q2)/2,q3=pk(r,[-30,-10,10,30,50,70]);return{ex:`Після 1-го дотику: (${q1}+(${q2}))/2 = ${a} нКл. Після 2-го: (${a}+(${q3}))/2 = ${(a+q3)/2} нКл.`,q:`Три однакові маленькі кульки мають заряди ${q1} нКл, ${q2} нКл і ${q3} нКл. Спочатку торкнулися та розвели 1-шу й 2-гу кульки, потім — 1-шу й 3-тю. Який заряд має перша кулька в кінці?`,ans:(a+q3)/2,u:'нКл',wr:[[a,'Після другого дотику заряд першої кульки знову змінюється.'],[(q1+q2+q3)/3,'Заряд ділиться порівну лише між кульками, що торкалися.'],[q1+q2+q3,'Заряд між двома однаковими кульками ділиться навпіл.']]}}},
{t:2,n:'Сила Ампера',f:r=>{const B=pk(r,[.1,.2,.4]),I=pk(r,[2,4,6,10]),l=pk(r,[.5,1,2]);return{ex:`F = BIl·sin30° = ${fm(B)}·${I}·${fm(l)}·½ = ${fm(B*I*l/2)} Н.`,q:`Провідник довжиною ${fm(l)} м зі струмом ${I} А розташований в однорідному магнітному полі з індукцією ${fm(B)} Тл під кутом 30° до ліній індукції. Знайдіть силу Ампера.`,ans:B*I*l/2,u:'Н',wr:[[B*I*l,'Забули sin α: sin 30° = 1/2.'],[.87*B*I*l,'Це cos 30°, а потрібен sin 30°.'],[B*I*l/4,'sin 30° = 1/2, а не 1/4.']]}}},
{t:3,n:'Хвиля: протифаза',f:r=>{const v=pk(r,[85,170,340,680]);return{ex:`λ = v/ν = 340/${v} = ${fm(340/v)} м. У протифазі точки віддалені на λ/2 = ${fm(340/v/2)} м.`,q:`Звук має частоту ${v} Гц. Швидкість звуку в повітрі 340 м/с. Яка мінімальна відстань між двома точками, що коливаються в протифазі, у напрямку поширення хвилі?`,ans:340/v/2,u:'м',wr:[[340/v,'Це довжина хвилі; у протифазі точки віддалені на λ/2.'],[340*v,'λ = v/ν, а не v·ν.'],[680/v,'Мінімальна відстань у протифазі — λ/2, а не 2λ.']]}}},
{t:3,n:'Математичний маятник',f:r=>{const k=pk(r,[2,3,4,5]),f=k*k;return{ex:`T ∼ √l: довжина зросла в ${f} разів, тож період — у √${f} = ${k} раз.`,q:`Довжину нитки математичного маятника збільшили в ${f} разів. У скільки разів збільшився період коливань?`,ans:k,u:'раз',wr:[[f,'T = 2π√(l/g): період зростає як √l, а не як l.'],[f/2,'Період пропорційний кореню з довжини.'],[f*f,'Період залежить від √l, а не від l².']]}}},
{t:3,n:'Збиральна лінза',f:r=>{const F=pk(r,[10,12,15,20]),[c,e]=pk(r,[[2,2],[1.5,3],[3,1.5]]),d=c*F;return{ex:`1/f = 1/F − 1/d = 1/${F} − 1/${fm(d)}, звідки f = ${fm(e*F)} см.`,q:`Предмет розташований на відстані ${fm(d)} см від збиральної лінзи з фокусною відстанню ${F} см (див. рисунок). Знайдіть відстань від лінзи до зображення.`,fig:lens(F,d),ans:e*F,u:'см',wr:[[d-F,'Користуйтеся формулою тонкої лінзи 1/F = 1/d + 1/f.'],[d*F/(d+F),'Знак: 1/f = 1/F − 1/d.'],[2*F,'f = 2F лише коли d = 2F.']]}}},

const zk=t=>t.g+'|'+t.q+'|'+t.ans+'|'+(t.items||'');
function load(){ST=Object.assign({h:[],ex:[],er:[],dy:{},tm:0},JSON.parse(LS.getItem(UK())||'null'));seen=new Set(ST.h.map(x=>x.z))}
load();
const sv=()=>LS.setItem(UK(),JSON.stringify(ST));
const ok=t=>t&&isFinite(t.ans)&&Math.abs(t.ans)<1e6&&Math.abs(t.ans*100-Math.round(t.ans*100))<1e-6;
function mk(g,s,d){const t=G[g].f(R(s),d||2);t.g=g;t.s=s;t.d=d||2;return t}
function fresh(g,d){let t;for(let i=0;i<120;i++){t=mk(g,1+Math.floor(Math.random()*1e9),d);if(ok(t)&&!seen.has(zk(t)))return t}return t}
function gen(top,u,mm){let c=G.map((x,i)=>i).filter(i=>(top==null||G[i].t==top)&&!!G[i].m==!!mm),c2=c.filter(i=>!(u&&u.has(i)));if(c2.length)c=c2;const n=i=>ST.h.filter(x=>x.g==i).length+Math.random()*2;return c.sort((a,b)=>n(a)-n(b))[0]}
function opts(t){const r=R(t.s+7);let w=[];t.wr.forEach(x=>{const v=+(+x[0]).toFixed(2);if(v!=t.ans&&!w.includes(v))w.push(v)});for(let k=2;w.length<3;k++){const v=+(t.ans*k+k).toFixed(2);if(v!=t.ans&&!w.includes(v))w.push(v)}const o=[t.ans,...w.slice(0,3)];for(let i=3;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}
const num=v=>parseFloat(String(v).replace(',','.'));
function judge(t,val){const c=Math.abs(val-t.ans)<.006,w=t.wr.find(x=>Math.abs(x[0]-val)<.006);return{c,tip:c?'':isNaN(val)?'Відповіді немає.':w?w[1]:'Перевірте формулу, одиниці виміру та округлення.'}}
function rec(t,k,j,m){ST.h.push({g:t.g,s:t.s,d:t.d,t:G[t.g].t,ok:j.c,k,m,ts:Date.now(),tip:j.tip,z:zk(t)});seen.add(zk(t));const dk=new Date().toISOString().slice(0,10);ST.dy[dk]=(ST.dy[dk]||0)+1;ST.er=ST.er.filter(e=>!(e.g==t.g&&e.s==t.s));if(!j.c)ST.er.push({g:t.g,s:t.s,d:t.d,k,tip:j.tip});sv()}
const $=s=>document.querySelector(s);
let V='home',S=null,TM=null;

function stat(){return TP.map((n,i)=>{const h=ST.h.filter(x=>x.t==i),c=h.filter(x=>x.ok).length;return{n,k:h.length,p:h.length?Math.round(c/h.length*100):null}})}
const col=p=>p==null?'var(--b)':p<60?'var(--r)':p<80?'#d9a400':'var(--g)';
function home(){const s=stat(),w=s.filter(x=>x.k>=3&&x.p<60),tips={};ST.h.filter(x=>!x.ok&&x.tip).forEach(x=>tips[x.tip]=(tips[x.tip]||0)+1);const tt=Object.entries(tips).sort((a,b)=>b[1]-a[1]).slice(0,4);
return plan()+`<div class=card><h2>Карта знань</h2>${s.map(x=>`<div class=row><span>${x.n}</span><div class=bar><i style="width:${x.p||0}%;background:${col(x.p)}"></i></div><b>${x.p==null?'—':x.p+'%'}</b></div>`).join('')}<div class=act><button class=p onclick="start('diag')">Вступна діагностика (10 завдань)</button></div></div>
<div class=card><h2>Слабкі місця</h2>${w.length?w.map(x=>`<p>⚠ ${x.n}: ${x.p}% (${x.k} завдань)</p>`).join(''):'<p class=mut>Пройдіть діагностику або потренуйтеся: після 3 завдань із теми тут з’являться слабкі місця.</p>'}</div>

function start(m,min){const u=new Set(),pg=t=>{const g=gen(t,u);u.add(g);return fresh(g,2)};

return `<div class=card><h2>Прогрес</h2><p class=mut>Прогрес зберігається лише в цьому браузері на цьому пристрої.</p><p>Розв’язано: <b>${n}</b>, правильно: <b>${n?Math.round(c/n*100):0}%</b>. Час підготовки: <b>${Math.floor(ST.tm/3600)} год ${Math.floor(ST.tm/60)%60} хв</b></p><h2>Завдань за день</h2>${days()}<h2>Досягнення</h2>${ACH.map(a=>`<span class="ach${a[1](ST)?' on':''}">🏅 ${a[0]}</span>`).join('')}<h2>Результати екзаменів</h2>${ch}</div>

/* ===== AI Helper (smart + optional Groq) ===== */
const AI_WELCOME = `Привіт! Я AI-помічник для підготовки до НМТ з фізики.

Швидкі кнопки працюють завжди (офлайн) і використовують готові розв’язання з бази.

Щоб я відповідав на вільні питання докладніше (як ChatGPT), додай безкоштовний ключ Groq:
1) зайди на console.groq.com
2) створи API Key (без картки)
3) натисни 🔑 у цьому чаті і встав ключ

Ключ зберігається лише у твоєму браузері.`;

function aiGetKey(){ return localStorage.getItem('nmt_groq_key') || ''; }
function aiSetKey(k){ if(k) localStorage.setItem('nmt_groq_key', k.trim()); else localStorage.removeItem('nmt_groq_key'); }

function aiToggle(){
  const p=document.getElementById('ai-panel');
  const open=p.classList.toggle('open');
  if(open && !p.dataset.init){
    p.dataset.init='1';
    aiAdd('bot', AI_WELCOME);
    aiUpdateKeyBtn();
  }
}

function aiUpdateKeyBtn(){
  const b=document.getElementById('ai-key-btn');
  if(!b) return;
  b.textContent = aiGetKey() ? '🔑 Ключ OK' : '🔑 Додати ключ Groq';
  b.title = aiGetKey() ? 'Ключ збережено. Натисни, щоб змінити/видалити' : 'Додати безкоштовний ключ для розумних відповідей';
}

function aiAskKey(){
  const cur=aiGetKey();
  const msg = cur
    ? 'Ключ уже є. Введи новий (або залиш порожнім, щоб видалити):'
    : 'Встав безкоштовний API-ключ з console.groq.com (починається з gsk_):';
  const k = prompt(msg, cur || '');
  if(k===null) return;
  aiSetKey(k);
  aiUpdateKeyBtn();
  aiAdd('bot', k.trim()
    ? '✅ Ключ збережено. Тепер я можу детально відповідати на вільні питання.'
    : 'Ключ видалено. Швидкі кнопки як і раніше працюють офлайн.');
}

function aiAdd(who, text){
  const box=document.getElementById('ai-msgs');
  const d=document.createElement('div');
  d.className='ai-msg '+who;
  d.textContent=text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}

function aiCurTask(){
  if(typeof S==='undefined'||!S) return null;
  if(S.m==='train' && S.t) return {t:S.t, k:S.k, v:S.v, fb:!!S.fb};
  if((S.m==='exam'||S.m==='diag') && S.L && S.L[S.i]){
    const it=S.L[S.i];
    return {t:it.t, k:it.k, v:(S.d&&S.d[S.i]!==undefined)?S.d[S.i]:(S.a?S.a[S.i]:undefined), fb:false};
  }
  return null;
}

function aiContextBlock(cur){
  if(!cur||!cur.t) return 'Зараз немає відкритого завдання.';
  const t=cur.t;
  const topic = (typeof TP!=='undefined' && G && G[t.g]) ? TP[G[t.g].t] : '';
  const name = G && G[t.g] ? G[t.g].n : '';
  let s = 'Тема: ' + topic + (name?' · '+name:'') + '\n';
  s += 'Умова: ' + t.q + '\n';
  if(t.ans!=null) s += 'Правильна відповідь: ' + fm(t.ans) + ' ' + (t.u||'') + '\n';
  if(t.ex) s += 'Готове розв’язання з бази: ' + t.ex + '\n';
  if(t.wr && t.wr.length){
    s += 'Типові помилки:\n';
    t.wr.forEach(w => { s += '• якщо відповіли '+fm(w[0])+': '+w[1]+'\n'; });
  }
  if(cur.v!=null && cur.v!==''){
    s += 'Відповідь учня зараз: ' + (Array.isArray(cur.v)?JSON.stringify(cur.v):cur.v) + '\n';
  }
  return s;
}

function aiHint(t){
  if(t.ex){
    const parts=t.ex.split(/[.!?]/).filter(s=>s.trim().length>8);
    if(parts.length>=2){
      return 'Підказка:\n' + parts[0].trim() + '…\n\nСпробуй спочатку сам, а потім попроси повне розв’язання.';
    }
  }
  if(t.wr && t.wr.length){
    return 'Підказка: зверни увагу на типові помилки.\n• ' + t.wr[0][1];
  }
  return 'Підказка: уважно перечитай умову, випиши дані та потрібну формулу. Якщо не виходить — попроси розв’язання.';
}

function aiSolution(t){
  if(t.ex) return '📖 Розв’язання:\n\n' + t.ex + (t.ans!=null ? '\n\nВідповідь: ' + fm(t.ans) + ' ' + (t.u||'') : '');
  return 'На жаль, для цього завдання немає готового розв’язання в базі.';
}

function aiWhy(cur){
  const t=cur.t, v=cur.v;
  if(v==null || v==='' || (Array.isArray(v) && !v.some(x=>x!=null&&x!==''))){
    return 'Спочатку обери або введи свою відповідь, а потім натисни «Чому не моя відповідь?» — я порівняю її з правильною.';
  }
  if(cur.k==='mt'){
    const key=t.key||[];
    let msg='Порівняння відповідностей:\n';
    let ok=0;
    key.forEach((correct,i)=>{
      const user=v[i];
      const letter=c=>'АБВГД'[c];
      if(user===correct){ ok++; msg += `✅ ${i+1} → ${letter(correct)} правильно\n`; }
      else msg += `❌ ${i+1}: ти обрав ${user!=null?letter(user):'—'}, правильно ${letter(correct)}\n`;
    });
    msg += `\nПравильно пар: ${ok} з ${key.length}.`;
    if(t.ex) msg += '\n\n' + t.ex;
    return msg;
  }
  const userVal = typeof v==='number' ? v : num(v);
  if(Math.abs(userVal - t.ans) < 0.006){
    return '✅ Твоя відповідь правильна! (' + fm(t.ans) + ' ' + (t.u||'') + ')';
  }
  let tip='';
  if(t.wr){
    const found=t.wr.find(x=>Math.abs(+x[0]-userVal)<0.006);
    if(found) tip='\n\nТипова помилка:\n' + found[1];
  }
  return 'Ти обрав: ' + fm(userVal) + ' ' + (t.u||'') +
         '\nПравильна відповідь: ' + fm(t.ans) + ' ' + (t.u||'') +
         tip +
         (t.ex ? '\n\nРозв’язання:\n' + t.ex : '');
}

function aiExplainTopic(t){
  const topic = (typeof TP!=='undefined' && G && G[t.g]) ? TP[G[t.g].t] : 'фізики';
  const name = G && G[t.g] ? G[t.g].n : '';
  return `Тема: ${topic}${name?' · '+name:''}.\n\nУмова:\n${t.q}\n\n` +
         (t.ex ? 'Ключова ідея розв’язання:\n' + t.ex.split('.')[0] + '.' : 'Спробуй згадати відповідну формулу з цієї теми.');
}

function aiQuick(type){
  const cur=aiCurTask();
  if(!cur || !cur.t){
    aiAdd('bot', 'Зараз немає активного завдання.\nПерейди в «Тренування», «Екзамен» або «Діагностику» і відкрий задачу — тоді я зможу допомогти з конкретною умовою.');
    return;
  }
  const t=cur.t;
  let reply='';
  if(type==='hint') reply=aiHint(t);
  else if(type==='solution') reply=aiSolution(t);
  else if(type==='why') reply=aiWhy(cur);
  else if(type==='explain') reply=aiExplainTopic(t);
  aiAdd('user', {hint:'💡 Дай підказку',solution:'📖 Покажи розв’язання',why:'❓ Чому не моя відповідь?',explain:'🧠 Поясни тему'}[type]);
  setTimeout(()=>aiAdd('bot', reply), 280);
}

async function aiCallGroq(userMsg, cur){
  const key = aiGetKey();
  if(!key) return null;
  const system = `Ти — доброзичливий репетитор з фізики для підготовки до українського НМТ.
Відповідай українською, коротко і зрозуміло для школяра 10–11 класу.
Пояснюй кроки, формули, одиниці виміру. Не вигадуй зайвого.
Якщо є готове розв’язання з бази — спирайся на нього і розкривай докладніше.
Якщо учень просить підказку — не давай одразу повну відповідь.
Контекст поточного завдання:
${aiContextBlock(cur)}`;

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      temperature: 0.4,
      max_tokens: 900,
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: userMsg }
      ]
    })
  });
  if(!res.ok){
    const err = await res.text().catch(()=> '');
    if(res.status===401) throw new Error('Невірний ключ Groq. Натисни 🔑 і встав правильний ключ.');
    if(res.status===429) throw new Error('Ліміт безкоштовних запитів Groq. Спробуй через хвилину або використай швидкі кнопки.');
    throw new Error('Помилка API ('+res.status+'). ' + (err.slice(0,120)||''));
  }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || 'Порожня відповідь моделі.';
}

function aiLocalFallback(q, cur){
  const low=q.toLowerCase();
  if(!cur || !cur.t){
    return 'Зараз немає відкритого завдання.\nСпочатку почни тренування або екзамен, а потім питай.\n\nЩоб я відповідав розумніше на будь-які питання — додай безкоштовний ключ Groq (кнопка 🔑).';
  }
  if(/підказ|подсказ|hint|натяк/.test(low)) return aiHint(cur.t);
  if(/розв.?яз|решен|solution|відповідь|ответ|покажи/.test(low)) return aiSolution(cur.t);
  if(/чому|почему|why|не так|помилк|ошибк/.test(low)) return aiWhy(cur);
  if(/формул|formula|як знайти|как найти/.test(low)) return aiSolution(cur.t);

  let msg = 'Питання щодо завдання:\n«' + cur.t.q.slice(0,140) + (cur.t.q.length>140?'…':'') + '»\n\n';
  if(cur.t.ex){
    msg += 'Ось розв’язання з бази:\n\n' + cur.t.ex;
    if(cur.t.ans!=null) msg += '\n\nВідповідь: ' + fm(cur.t.ans) + ' ' + (cur.t.u||'');
    msg += '\n\n💡 Для більш детальних пояснень «своїми словами» додай безкоштовний ключ Groq (кнопка 🔑 зверху чату).';
  } else {
    msg += 'Додай ключ Groq (кнопка 🔑), щоб я міг детально пояснювати.';
  }
  return msg;
}

async function aiSend(){
  const inp=document.getElementById('ai-input');
  const q=(inp.value||'').trim();
  if(!q) return;
  inp.value='';
  aiAdd('user', q);
  const typing=aiAdd('bot', 'Думаю…');
  typing.classList.add('ai-typing');
  const cur=aiCurTask();
  try{
    let reply = null;
    if(aiGetKey()){
      try{
        reply = await aiCallGroq(q, cur);
      }catch(e){
        reply = '⚠️ ' + (e.message||e) + '\n\n' + aiLocalFallback(q, cur);
      }
    } else {
      reply = aiLocalFallback(q, cur);
    }
    typing.remove();
    aiAdd('bot', reply);
  }catch(e){
    typing.remove();
    aiAdd('bot', 'Сталася помилка: ' + (e.message||e));
  }
}

</script>

  <div id="ai-msgs"></div>
  <div id="ai-quick">
    <button onclick="aiQuick('hint')">💡 Дай підказку</button>
    <button onclick="aiQuick('solution')">📖 Покажи розв’язання</button>
    <button onclick="aiQuick('why')">❓ Чому не моя відповідь?</button>
    <button onclick="aiQuick('explain')">🧠 Поясни тему</button>
  </div>
  <div id="ai-input-row">
    <input id="ai-input" placeholder="Напиши питання..." onkeydown="if(event.key==='Enter')aiSend()">

</div>
